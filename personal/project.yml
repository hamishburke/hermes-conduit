# Generate from the repository root with --project-root .
name: Elio
include:
  - path: project.yml
settings:
  base:
    DEVELOPMENT_TEAM: ""
targets:
  Conduit:
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hamishburke.elio
        PRODUCT_NAME: Elio
        PRODUCT_MODULE_NAME: Conduit
        DEVELOPMENT_TEAM: ""
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ELIO_PERSONAL"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: Apple Development
        PROVISIONING_PROFILE_SPECIFIER: ""
        CODE_SIGN_ENTITLEMENTS: personal/Elio.entitlements
        CONDUIT_URL_SCHEME: elio
        CONDUIT_DEFAULT_RELAY_URL: ""
    dependencies:REPLACE:
      - package: WebRTC
      - sdk: ImagePlayground.framework
        weak: true
      - sdk: ActivityKit.framework
        weak: true
  ConduitTests:
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) ELIO_PERSONAL"

# Upstream defines no schemes (CI builds the implicit Conduit scheme), and an
# implicit scheme carries no Test action, so `xcodebuild test -scheme Conduit`
# refuses ConduitTests. This personal-only scheme exists so the pinned tests can
# be run on a simulator or device without editing the shared project.yml.
schemes:
  ElioTests:
    build:
      targets:
        Conduit: all
        ConduitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - ConduitTests
